<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D2L Archive</title>
    <script src="src/dashboard/appearance.js"></script>
    <link rel="stylesheet" href="src/dashboard/dashboard.css">
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="#/" aria-label="Dashboard home">
          <img id="school-logo" class="brand-logo" src="src/dashboard/img/d2l-brightspace.png" alt="D2L Brightspace" draggable="false">
          <span id="brand-fallback" class="brand-mark" aria-hidden="true" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 5l9 4.5-9 4.5z M7 11.6V16c0 1.4 2.2 2.6 5 2.6s5-1.2 5-2.6v-4.4 M21 9.5v5"/></svg></span>
        </a>
        <div class="topbar-spacer"><form class="top-search" data-action="search" role="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13z M20 20l-4.2-4.2"/></svg><input name="q" type="search" placeholder="Search your D2L archive" aria-label="Search your D2L archive" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-panel"></form><div id="search-panel" class="search-panel" role="listbox" aria-label="Search results" hidden></div></div>
        <div class="menu-root">
          <button id="profile-button" class="profile-trigger" type="button" data-menu-toggle aria-controls="account-menu" aria-expanded="false" aria-label="Account menu" title="Account menu">
            <span class="profile-avatar"><img id="profile-avatar" alt="" draggable="false" hidden><span id="profile-avatar-fallback" class="profile-avatar-fallback" aria-hidden="true"></span></span>
            <span class="sync-dot" aria-hidden="true" hidden></span>
          </button>
          <div id="account-menu" class="menu account-menu" hidden>
            <div class="account-header">
              <span class="account-who"><b id="profile-name">Your account</b><span id="sync-hint" class="account-status"></span></span>
              <span class="account-avatar-recess" aria-hidden="true"></span>
            </div>
            <div class="account-slider"><div class="account-track">
              <div class="account-pane" id="account-main">
                <button id="sync-button" class="account-sync sync-btn" type="button" data-action="sync"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8 M4 4v4h4 M4 13a8 8 0 0 0 14.3 4.9L20 16 M20 20v-4h-4"/></svg><span id="sync-label">Sync from D2L</span></button>
                <div class="account-sep"></div>
                <a class="menu-item" href="#/settings"><span class="menu-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg></span><b>Settings</b></a>
                <button class="menu-item" type="button" data-action="account-help"><span class="menu-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.5M12 17.2h.01"/></svg></span><b>Help &amp; campus links</b><span class="menu-chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></button>
                <div class="overlay-only">
                  <div class="account-sep"></div>
                  <button id="overlay-close" class="menu-item overlay-close" type="button" data-action="close-overlay"><span class="menu-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12 M18 6 6 18"/></svg></span><b>Close D2L Archive</b></button>
                </div>
              </div>
              <div class="account-pane" id="account-help" inert>
                <button class="menu-item account-back" type="button" data-action="account-back"><span class="menu-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></span><b>Help &amp; campus links</b></button>
                <div class="account-sep"></div>
            <a class="menu-item" href="https://campus.kennesaw.edu/offices-services/library/" target="_blank" rel="noopener noreferrer"><span class="menu-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6 M20 4l-9 9 M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></span><b>KSU Libraries</b></a>
            <a class="menu-item" href="https://campus.kennesaw.edu/faculty-staff/academic-affairs/student-success/smart-center/" target="_blank" rel="noopener noreferrer"><span class="menu-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6 M20 4l-9 9 M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></span><b>SMART Center tutoring</b></a>
            <a class="menu-item" href="https://campus.kennesaw.edu/current-students/academics/writing-center/" target="_blank" rel="noopener noreferrer"><span class="menu-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6 M20 4l-9 9 M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></span><b>Writing Center</b></a>
                <div class="menu-note">Campus links open KSU's own sites. This dashboard is not affiliated with Kennesaw State University or D2L.</div>
              </div>
            </div></div>
          </div>
        </div>
      </header>
      <div class="frame">
        <nav id="nav" class="sidenav" aria-label="Main"></nav>
        <main id="main" class="main" tabindex="-1"></main>
      </div>
    </div>
    <div id="detail-root"></div>
    <div id="toast" class="toast" role="status" hidden></div>
