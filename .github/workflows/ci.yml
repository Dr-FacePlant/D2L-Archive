name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Local checks
        run: node run-local-checks.mjs
      - name: Static extension validation
        run: node tools/validate-extension.mjs
